<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iphone duo test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 右方向へシームレスに流れる無限スクロールアニメーション */
        @keyframes scrollRight {
            0% {
                transform: translateX(-50%);
            }
            100% {
                transform: translateX(0%);
            }
        }

        .scroll-container {
            display: flex;
            width: 200%;
            height: 100vh;
            animation: scrollRight 30s linear infinite;
            will-change: transform;
        }
    </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-black w-screen h-screen">

    <!-- 無限スクロールトラック -->
    <div class="scroll-container">
        <!-- 1枚目の画像 -->
        <img src="machi.jpeg" 
             alt="街並み 1" 
             class="w-1/2 h-full object-cover flex-shrink-0"
             onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/38bdf8/ffffff?text=machi.jpeg+Not+Found';">
        
        <!-- 2枚目の画像（ループ用） -->
        <img src="machi.jpeg" 
             alt="街並み 2" 
             class="w-1/2 h-full object-cover flex-shrink-0"
             onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/38bdf8/ffffff?text=machi.jpeg+Not+Found';">
    </div>
        <!-- 無限スクロールトラック -->

        <!-- 2枚目の画像（ループ用） -->

</body>
</html>
